# Overlay on configs/default.yaml (see src.config.load_config). Only the fields below change.
# Model id and standard-tier text prices from https://ai.google.dev/gemini-api/docs/pricing
# retrieved 2026-10-24. thinking_budget 0 keeps this comparable to gpt-5-nano's minimal effort:
# Gemini 2.5 Flash-Lite can disable thinking, and thinking tokens are billed as output.

llm:
  provider: gemini
  model: gemini-2.5-flash-lite
  api: generate_content
  params:
    temperature: 0
    top_p: 1
    max_output_tokens: 256
    seed: 42
    thinking_budget: 0
  timeout_s: 60

# Measured 2026-10-24 on this key: free-tier cap is 20 generateContent
# requests per day for gemini-2.5-flash-lite (GenerateRequestsPerDayPerProjectPerModel-FreeTier).
# A full run needs billing on that project. These limits are for the paid tier.
runner:
  concurrency: 8
  rpm: 300
  tpm: 200000

pricing:
  gemini-2.5-flash-lite:
    input_per_1m: 0.10
    cached_input_per_1m: 0.01
    output_per_1m: 0.40
    source: https://ai.google.dev/gemini-api/docs/pricing
    retrieved: "2026-10-24"
    note: standard paid tier, text; output price includes thinking tokens
