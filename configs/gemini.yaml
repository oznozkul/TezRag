# Overlay on configs/default.yaml (see src.config.load_config). Only the fields below change.
# Model id and standard-tier text prices from https://ai.google.dev/gemini-api/docs/pricing
# retrieved 2026-11-01. gemini-2.5-flash-lite is closed to new keys. This model rejects
# thinking_budget; its default thinking level is minimal, and thinking tokens are billed as output.

llm:
  provider: gemini
  model: gemini-3.5-flash-lite
  api: generate_content
  params:
    temperature: 0
    top_p: 1
    max_output_tokens: 256
    seed: 42
  timeout_s: 60

# This key is on the free tier: 15 generateContent requests per minute for
# gemini-3.5-flash-lite. Stay under that. A burst at concurrency 8 returns 429
# and the retries are recorded as errors.
runner:
  concurrency: 1
  rpm: 12
  tpm: 200000

pricing:
  gemini-3.5-flash-lite:
    input_per_1m: 0.30
    cached_input_per_1m: 0.03
    output_per_1m: 2.50
    source: https://ai.google.dev/gemini-api/docs/pricing
    retrieved: "2026-11-01"
    note: standard paid tier, text; output price includes thinking tokens
